
name: Weather Pipeline

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: weather-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: BACKEND

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      LATITUDE: ${{ vars.LATITUDE || '31.5204' }}
      LONGITUDE: ${{ vars.LONGITUDE || '74.3587' }}

      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/BACKEND

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: BACKEND/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Project Files
        run: |
          test -f src/ingestion/main.py
          test -f src/agents/run_forecast.py
          echo "Project files verified successfully"

      - name: Verify Python Syntax
        run: |
          python -m compileall -q src

      - name: Run Weather Data Ingestion
        run: |
          python -m src.ingestion.main

      - name: Run Forecast Agent
        run: |
          python -m src.agents.run_forecast

      - name: Upload Logs and Agent State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-pipeline-logs
          path: |
            BACKEND/logs/
            BACKEND/data/processed/agent_state.json
          if-no-files-found: ignore
          retention-days: 7
